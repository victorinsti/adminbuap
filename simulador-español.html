let actual = 0;
let aciertos = 0;

document.getElementById("totalPreguntas").textContent =
preguntas.length;

function cargarPregunta(){

document.getElementById("numeroPregunta").textContent =
actual + 1;

document.getElementById("pregunta").textContent =
preguntas[actual].pregunta;

let html = "";

preguntas[actual].opciones.forEach(opcion=>{

html += `
<div class="opcion">
<label>
<input
type="radio"
name="respuesta"
value="${opcion}">
${opcion}
</label>
</div>
`;

});

document.getElementById("opciones").innerHTML = html;

}

function siguientePregunta(){

let seleccion =
document.querySelector(
'input[name="respuesta"]:checked'
);

if(!seleccion){

alert("Selecciona una respuesta");

return;

}

if(
seleccion.value ===
preguntas[actual].correcta
){

aciertos++;

}

actual++;

if(actual < preguntas.length){

cargarPregunta();

}else{

let porcentaje =
Math.round(
(aciertos / preguntas.length) * 100
);

document.querySelector(".card").innerHTML = `

<div class="materia">
Resultado Final
</div>

<h1>${aciertos}/${preguntas.length}</h1>

<h2>${porcentaje}%</h2>

<p>
Has terminado el simulador.
</p>

<a
href="simulador-matematicas.html"
class="btn-finalizar">
Intentar nuevamente
</a>

`;

}

}
