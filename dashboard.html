<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard ADMIN BUAP</title>

<style>

body{
    font-family:Segoe UI;
    margin:0;
    background:#f4f6fa;
}

.navbar{
    background:#003B7A;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.btn{
    background:#003B7A;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    display:inline-block;
    margin-top:10px;
    text-decoration:none;
}

#logoutBtn{
    background:#dc3545;
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<script type="module" src="js/auth.js"></script>

<nav class="navbar">

<h2>ADMIN BUAP</h2>

<button id="logoutBtn">
Cerrar Sesión
</button>

</nav>

<div class="container">

<h1>Mis Simuladores</h1>

<div class="cards">

<div class="card">

<h3>Matemáticas</h3>

<p>
Practica álgebra, geometría y probabilidad.
</p>

<a href="simulador-matematicas.html" class="btn">
Entrar
</a>

</div>

<div class="card">

<h3>Razonamiento Verbal</h3>

<p>
Comprensión lectora e inferencias.
</p>

<a href="#" class="btn">
Entrar
</a>

</div>

<div class="card">

<h3>Ciencias</h3>

<p>
Biología, Física y Química.
</p>

<a href="#" class="btn">
Entrar
</a>

</div>

</div>

</div>

<script type="module" src="js/logout.js"></script>

</body>
</html>
